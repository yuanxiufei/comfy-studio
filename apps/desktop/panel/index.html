<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="img-src http://127.0.0.1:* http://localhost:* data:; style-src 'unsafe-inline'; script-src 'self'">
  <title>Skill 面板</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #191922; color: #e0e0e8; }
    #app { display: flex; height: 100vh; }
    #sidebar { width: 260px; border-right: 1px solid #2a2a38; padding: 12px; overflow-y: auto; flex-shrink: 0; }
    #sidebar h1 { font-size: 15px; margin: 4px 0 12px; color: #9a9ab0; letter-spacing: 1px; }
    #skill-list { list-style: none; margin: 0; padding: 0; }
    #skill-list li { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
    #skill-list li:hover { background: #232333; }
    #skill-list li.active { background: #2d2d44; color: #fff; }
    #main { flex: 1; overflow-y: auto; padding: 24px 32px; }
    #skill-title { margin: 0 0 6px; font-size: 20px; }
    #skill-desc { color: #9a9ab0; margin: 0 0 20px; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; margin-bottom: 4px; }
    .field label .req { color: #e05555; }
    .field input, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid #3a3a4e; border-radius: 4px; background: #13131c; color: #e0e0e8; font: inherit; }
    .field textarea { min-height: 72px; resize: vertical; }
    .field .hint { font-size: 12px; color: #77778d; margin-top: 3px; }
    #run { padding: 9px 26px; border: none; border-radius: 5px; background: #4a6cf7; color: #fff; font-size: 14px; cursor: pointer; margin-top: 6px; }
    #run:disabled { background: #34344a; cursor: default; }
    #progress { margin-top: 16px; font-size: 13px; color: #9a9ab0; min-height: 20px; }
    #error { margin-top: 16px; color: #e05555; font-size: 13px; white-space: pre-wrap; }
    #results { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 12px; }
    #results img { max-width: 320px; max-height: 320px; border-radius: 6px; border: 1px solid #2a2a38; }
    #empty { color: #77778d; margin-top: 80px; text-align: center; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>SKILLS</h1>
      <ul id="skill-list"></ul>
    </aside>
    <main id="main">
      <div id="empty">从左侧选择一个 skill</div>
      <div id="detail" hidden>
        <h2 id="skill-title"></h2>
        <p id="skill-desc"></p>
        <form id="form"></form>
        <button id="run" type="button">运行</button>
        <div id="progress"></div>
        <div id="error"></div>
        <div id="results"></div>
      </div>
    </main>
  </div>
  <script src="panel.js"></script>
</body>
</html>
