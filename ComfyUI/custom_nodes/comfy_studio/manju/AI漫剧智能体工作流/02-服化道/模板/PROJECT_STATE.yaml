# PROJECT_STATE.yaml — 项目状态
# 对应规格 §03｜PROJECT STATE
# 用法：每个连续漫剧项目复制一份，替换 <...> 占位符，随项目推进持续更新。
# 平台支持持久记忆时作为记忆体；不支持时在对话中维护。

PROJECT:
  id: "<PROJ_001>"
  name: "<项目名>"
  version: "v1.0"
  language: "zh-CN"
  genre: "<题材：都市/古装/玄幻/悬疑/科幻>"
  era: "<时代：现代都市/架空唐风/近未来>"
  location: "<主要地域>"
  world: "<一句话世界观>"

  # ── ID 注册表（跨模块共享，由 05 建纲时创建）──
  id_registry:
    path: "00_PROJECT/ID-REGISTRY.md"
    note: "全剧 ID 一次性分配，含未出场角色的预留号（RESERVED）；号位永不复用"
    status_flow: ["RESERVED", "DRAFT", "LOCKED", "DEPRECATED"]
    segments_owned_by_05: ["CHR_", "CST_", "PRP_", "ENV_"]
    segments_owned_by_02: ["POS_"]          # 本模块负责分配姿态段
    segments_owned_by_others: ["SHT_→01", "AUD_→04"]
    rule: "任何模块不得自造未登记 ID；升 LOCKED 只能由本模块（02）执行（只有本模块跑一致性 Gate）"

  # ── 未决项跟踪表（跨模块共享，由 05 建纲时创建）──
  open_issues:
    path: "00_PROJECT/OPEN-ISSUES.md"
    note: "外部依赖问题（版权/授权/平台/预算）启动阶段即登记"
    blocking_rule: "BLOCKING 项阻断发布，但不阻断生产"
    verify_before_publish: true

  # ── 视觉圣经（§04 WORLD BUILDER 输出）──
  # ⚠️ 取值**不在本文件固定**：权威是 `模板/VISUAL_BIBLE.md` §4.9「31 种风格速查」（ST-01~ST-31，
  #    出处 `源skill库/景/bootstrap-locations.md`）。旧占位符用 `/` 并列了 5 个词，
  #    它们**一个都不在 §4.9 表内**，而且分属两套词汇，并列还会被读成"任选其一"：
  #      · `写实 / 拟真人 / 半写实` —— 是**三视图出图标准**里的「风格」档位
  #        （`引擎/TURNAROUND-STANDARD.md` §1.1 标准表、`00-主控智能体.md` 同名清单），
  #        与 `超高细节 / 8K 级视觉细节 / 电影级灯光质量` 并列、**可叠加**；
  #        `src/rule_source.py` 的 `QUALITY_EN` 也把「写实 / 拟真人优先」按质量参数英译
  #        （`photorealistic / lifelike priority`）。它属于**出图档位词**，不是画风 ID。
  #      · `三渲二` —— 属**渲染体系**维度，只在已归档的 `_archive/00-主控智能体-简化版.md`
  #        （「渲染体系 ｜ UE5 / 三渲二 / 手绘 / 水彩」）出现过；§4.9 里对应 ST-02 赛璐珞动画、ST-03 写实CG 等。
  #    故改为「填 §4.9 的 ST 编号，需要时再叠加质量词」。
  visual_style: "<ST-XX ｜ 查 模板/VISUAL_BIBLE.md §4.9，如 ST-01；可叠质量词：ST-01 + photorealistic>"
  color_bible:
    primary: "<#HEX>"
    secondary: "<#HEX>"
    accent: "<#HEX>"
    skin: "<#HEX>"
    shadow: "<#HEX>"
    highlight: "<#HEX>"
    environment: "<#HEX>"
  lighting_bible:
    key: "<主光方向与性质>"
    fill: "<辅光>"
    rim: "<轮廓光>"
    ambient: "<环境光>"
    temperature: "<色温 K 或 冷/暖>"
    shadow: "<阴影性质>"
    atmosphere: "<氛围>"
  material_bible:
    wood: "<木材特征>"
    stone: "<石材特征>"
    metal: "<金属特征>"
    glass: "<玻璃特征>"
    ceramic: "<陶瓷特征>"
    leather: "<皮革特征>"
    fabric: "<布料特征>"
    paper: "<纸张特征>"
  camera_bible:
    lens_feeling: "<镜头感：35mm 纪实 / 85mm 人像 / 广角畸变>"
    depth: "<景深倾向>"
    framing: "<构图倾向>"
    camera_height: "<机位高度倾向>"
    movement: "<运动倾向>"

  # ── 资产索引（只放 ID，明细见各自资产卡）──
  characters: []
  costumes: []
  props: []
  environments: []
  expressions: []
  poses: []
  storyboards: []

  # ── 光影预设（来源：源skill库/风格/storyboard-lighting-master.md）──
  # 确认后全片不再更改，批量重绘必须逐字复用 lighting_prompt
  lighting_preset:
    style_name: ""            # 选定的光影风格名
    tone: ""                  # 该风格的色调描述
    lighting_prompt: ""       # 六维公式组合出的完整光影提示词（一字不改复用）
    fixed_suffix: "subtle backlight, 微微逆光"   # 固定附加词，每次必加
    negative_prompt: "flat lighting, overexposed, underexposed, harsh shadows, dirty shadows, blown highlights, unnatural skin tone"
    resolution: "4K"
    applied_scope: ""         # 适用场景/项目范围
    confirmed_at: ""          # 用户确认时间（确认后不得更改）

  # ── 风格校验阈值（来源：源skill库/风格/style-guardian.md）──
  style_check:
    method: "五维评分"        # 绘画风格/色彩调性/光影效果/维度风格/质感特征
    weights: "色彩0.25 光影0.25 绘画0.2 质感0.15 维度0.15"
    thresholds:
      pass: 90                # ≥90 放行
      warn: 70                # 70-89 → P2
      block_l1: 50            # 50-69 → P1
      block_l0: 0             # <50 → P0 阻断
    last_check: ""            # 最近一次校验结果与时间

  # ── 锁定与约束 ──
  locked_assets: []
  # 例：["LOCK_WORLD", "LOCK_CHARACTER:CHR_001", "LOCK_COLOR"]

  references: []
  # 例：[{type: "face", file: "ref/xxx.png", asset: "CHR_001"}]

  consistency_rules: []
  # 例：["同角色眼型不可变", "全片禁止出现任何文字"]

  forbidden_changes: []
  # 例：["不得改变 CHR_001 的脸型与瞳色", "不得重构 ENV_001 建筑结构"]

  # ── 进度指针 ──
  current_scene: ""
  current_shot: ""

# ── 状态检查清单（每次任务前自检）──
# [ ] PROJECT.id 是否已建立
# [ ] visual_style 是否已锁定
# [ ] color_bible / lighting_bible 是否齐全
# [ ] locked_assets 是否记录了本次任务必须锁定的项
# [ ] 角色 ID 是否已分配到 characters
